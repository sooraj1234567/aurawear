<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed - AURAWEAR</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces&family=Inter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.success-wrap{min-height:80vh;display:grid;place-items:center;padding:6vw;text-align:center;background:#FBF8F3}
.success-card{max-width:520px;border:1px solid rgba(0,0,0,.12);padding:48px;background:#fff}
.success-card h1{font-family:Fraunces;font-size:48px;font-weight:300;margin:0;line-height:.9}
.success-card h1 em{font-family:'Instrument Serif';font-style:italic}
.check{width:56px;height:56px;border-radius:50%;background:#1A1611;color:#fff;display:grid;place-items:center;margin:0 auto 24px;font-size:24px}
.order-id{margin-top:16px;font-size:11px;letter-spacing:2px;opacity:.5;border:1px dashed rgba(0,0,0,.15);padding:12px;display:inline-block}
</style>
</head>
<body>
<nav style="display:flex;justify-content:space-between;padding:20px 4vw;border-bottom:1px solid rgba(0,0,0,.12)"><div class="logo" style="font-family:Fraunces;letter-spacing:4px;font-size:20px;cursor:pointer" onclick="location.href='/'">AURAWEAR</div></nav>

<div class="success-wrap">
  <div class="success-card">
    <div class="check">✓</div>
    <h1>Order<br><em>Placed</em></h1>
    <p style="margin-top:20px;font-size:14px;opacity:.6;line-height:1.6">Your archive pieces are being packed. Small-batch, slow-made — you'll get a tracking email in 24h.</p>
    <div class="order-id" id="orderId">ORDER ID: ...</div>
    <div style="margin-top:28px;display:flex;gap:12px;justify-content:center">
      <a href="/" class="btn-gold" style="text-decoration:none;padding:14px 24px;background:#1A1611;color:#fff;font-size:10px;letter-spacing:2px">BACK TO ARCHIVE</a>
      <a href="/#shop" class="btn-gold" style="text-decoration:none;padding:14px 24px;background:#C9A86A;color:#fff;font-size:10px;letter-spacing:2px">CONTINUE SHOPPING</a>
    </div>
  </div>
</div>

<script>
// Show order ID from URL
const params = new URLSearchParams(location.search);
const id = params.get('id') || params.get('order_id');
document.getElementById('orderId').innerText = 'ORDER ID: ' + (id || 'AURAW-' + Date.now().toString().slice(-6));
// Ensure cart is cleared
localStorage.removeItem('aurawear_cart');
</script>
</body>
</html>
