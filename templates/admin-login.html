<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURAWEAR - Admin Secure Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin-login.css">
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h1>AURAWEAR</h1>
            <span class="badge-admin">Command Center Access</span>
        </div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label class="retro-label" for="admin-email">Admin Email</label>
                <input type="email" id="admin-email" class="retro-input" required placeholder="admin@aurawear.com">
            </div>

            <div class="form-group">
                <label class="retro-label" for="admin-password">Secure Password</label>
                <input type="password" id="admin-password" class="retro-input" required placeholder="••••••••••••">
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">Authenticate Session</button>
            <div id="error-msg"></div>
        </form>

        <div class="login-footer">
            <p>Protected System Environment &bull; <a href="/?preview=true">Return to Store</a></p>
        </div>
    </div>

    <script src="/js/admin-login.js"></script>
</body>
</html>
